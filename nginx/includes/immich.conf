# Immich must be served from the root of a host — it does not support subpaths,
# which is why it gets a dedicated port instead of a /img/ location like the
# rest of the stack. Included by both http-only.conf and https.conf.

# Resolve the upstream at request time so a stopped Immich can't stop nginx
# from starting (same trick as the /slskd location).
resolver 127.0.0.11 valid=30s;

client_max_body_size 50000M;
client_body_buffer_size 1024k;
proxy_request_buffering off;

proxy_read_timeout 600s;
proxy_send_timeout 600s;
send_timeout 600s;

location / {
  set $immich_upstream immich-server;
  proxy_pass http://$immich_upstream:2283;
  proxy_http_version 1.1;

  proxy_set_header Upgrade            $http_upgrade;
  proxy_set_header Connection         "upgrade";
  proxy_set_header Host               $host;
  proxy_set_header X-Real-IP          $remote_addr;
  proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto  $scheme;
  proxy_redirect off;
}
