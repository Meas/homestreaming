# Runs on the GPU box, NOT the NAS. Stateless: it holds no photos, no database
# and never touches STORAGE_ROOT. The NAS posts image previews to :3003 and gets
# back CLIP embeddings and face bounding boxes, which it stores in its own DB.
#
#   ./immich/start-immich-ml.sh     (pulls, then starts)
#   ./immich/stop-immich-ml.sh
#
# Point the NAS at it once: Admin -> Settings -> Machine Learning -> Add URL.
# IMMICH_VERSION must match the NAS, or the two drift and misbehave.

name: immich-remote-ml

services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-cuda
    container_name: immich-machine-learning
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  model-cache:
