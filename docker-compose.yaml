services:
  
  nginx:
    image: nginx:mainline-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
      # Immich cannot be served under a subpath, so it gets its own port.
      - "${IMMICH_HOST_PORT-2283}:2283"
    volumes:
      - ./nginx/html:/var/www/html
      - ./nginx/conf.d/${NGINX_CONFIG_NAME}.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/includes:/etc/nginx/includes
      - ./nginx/certs:/etc/ssl/certs
      - ${NGINX_SHARE_FILES}:/var/www/html/files
    networks:
      - app-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ${QBITTORRENT_CONFIG_PATH}:/config
      - ${STORAGE_ROOT}/downloads:/downloads
    networks:
      - app-network

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    user: ${PUID-1000}:${PGID-1000}
    volumes:
      - ${JELLYFIN_CONFIG_PATH}:/config
      - ${JELLYFIN_CACHE_PATH}:/cache
      - ${STORAGE_ROOT}/media:/media
    environment:
      - TZ=${TZ}
    networks:
      - app-network

  seerr:
    image: seerr/seerr:develop
    init: true
    container_name: seerr
    restart: unless-stopped
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./seerr/config:/app/config
    networks:
      - app-network
  adguardhome:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - ./adguard/config:/opt/adguardhome/conf
      - adguard-work-data:/opt/adguardhome/work
    networks:
      - app-network

  sonarr:
    image: ghcr.io/hotio/sonarr
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./sonarr/config/:/config
      - ${STORAGE_ROOT}:/data
    networks:
      - app-network

  radarr:
    image: ghcr.io/hotio/radarr
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./radarr/config/:/config
      - ${STORAGE_ROOT}:/data
    networks:
      - app-network
  lidarr:
    image: ghcr.io/hotio/lidarr
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./lidarr/config/:/config
      - ${STORAGE_ROOT}:/data
    networks:
      - app-network
  slskd:
    image: slskd/slskd
    container_name: slskd
    hostname: slskd
    profiles:
      - soularr-tools
    restart: unless-stopped
    user: ${PUID-1000}:${PGID-1000}
    environment:
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_UMASK=000
    volumes:
      - ./slskd/config:/app
      - ${STORAGE_ROOT}/media:/data
      - ${STORAGE_ROOT}/downloads/slskd/incomplete:/incomplete
      - ${STORAGE_ROOT}/downloads/slskd/downloads:/downloads
    networks:
      - app-network
  prowlarr:
    image: ghcr.io/hotio/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./prowlarr/config:/config
    networks:
      - app-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    networks:
      - app-network

  soularr:
    image: ghcr.io/mrusse/soularr:dev
    container_name: soularr
    hostname: soularr
    profiles:
      - soularr-tools
    restart: unless-stopped
    user: ${PUID-1000}:${PGID-1000}
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300
    volumes:
      - ${STORAGE_ROOT}/downloads/slskd/downloads:/downloads
      - ./soularr/config:/data
    networks:
      - app-network
    depends_on:
      - lidarr
      - slskd

  # Immich manages its own storage: originals, thumbnails and transcodes all
  # live under ${STORAGE_ROOT}/immich. Photos get in via the mobile app or the
  # CLI — dropping files into this folder by hand does nothing, Immich does not
  # scan it. It has no PUID/PGID support and runs as root.
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT}/immich:/data
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
    depends_on:
      - immich-postgres
      - immich-redis
    networks:
      - app-network

  # Postgres data must live on local disk — network shares are unsupported.
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if ./immich/postgres is not on an SSD.
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ./immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - app-network

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  adguard-work-data:
    driver: local