x-common: &common
  restart: unless-stopped
  networks:
    - app-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  
  nginx:
    <<: *common
    image: nginx:mainline-alpine
    container_name: nginx
    ports:
      - "${NGINX_HOST_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
      # Immich cannot be served under a subpath, so it gets its own port.
      - "${IMMICH_HOST_PORT-2283}:2283"
    volumes:
      - ./nginx/html:/var/www/html
      - ./nginx/conf.d/${NGINX_CONFIG_NAME}.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/includes:/etc/nginx/includes
      - ./nginx/certs:/etc/ssl/certs
      - ${NGINX_SHARE_FILES:-./nginx/html/files}:/var/www/html/files

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ${QBITTORRENT_CONFIG_PATH}:/config
      - ${STORAGE_ROOT}/downloads:/downloads

  jellyfin:
    <<: *common
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: ${PUID-1000}:${PGID-1000}
    volumes:
      - ${JELLYFIN_CONFIG_PATH}:/config
      - ${JELLYFIN_CACHE_PATH}:/cache
      - ${JELLYFIN_TRANSCODE_PATH:-${JELLYFIN_CACHE_PATH}/transcodes}:/transcodes
      - ${STORAGE_ROOT}/media:/media
    environment:
      - TZ=${TZ}

  seerr:
    <<: *common
    image: seerr/seerr:develop
    init: true
    container_name: seerr
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./seerr/config:/app/config
  adguardhome:
    <<: *common
    image: adguard/adguardhome
    container_name: adguard
    ports:
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - ./adguard/config:/opt/adguardhome/conf
      - adguard-work-data:/opt/adguardhome/work

  sonarr:
    <<: *common
    build:
      context: ./mkv-fix
      dockerfile: ../sonarr/Dockerfile
    container_name: sonarr
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./sonarr/config/:/config
      - ${STORAGE_ROOT}:/data

  radarr:
    <<: *common
    build:
      context: ./mkv-fix
      dockerfile: ../radarr/Dockerfile
    container_name: radarr
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./radarr/config/:/config
      - ${STORAGE_ROOT}:/data
  lidarr:
    <<: *common
    image: ghcr.io/hotio/lidarr
    container_name: lidarr
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./lidarr/config/:/config
      - ${STORAGE_ROOT}:/data
  slskd:
    <<: *common
    image: slskd/slskd
    container_name: slskd
    hostname: slskd
    profiles:
      - soularr-tools
    user: ${PUID-1000}:${PGID-1000}
    environment:
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_UMASK=000
    volumes:
      - ./slskd/config:/app
      - ${STORAGE_ROOT}/media:/data
      - ${STORAGE_ROOT}/downloads/slskd/incomplete:/incomplete
      - ${STORAGE_ROOT}/downloads/slskd/downloads:/downloads
  prowlarr:
    <<: *common
    image: ghcr.io/hotio/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
    volumes:
      - ./prowlarr/config:/config
    depends_on:
      - flaresolverr

  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}

  soularr:
    <<: *common
    image: ghcr.io/mrusse/soularr:dev
    container_name: soularr
    hostname: soularr
    profiles:
      - soularr-tools
    user: ${PUID-1000}:${PGID-1000}
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=${SOULARR_SCRIPT_INTERVAL:-1800}
    volumes:
      - ${STORAGE_ROOT}/downloads/slskd/downloads:/downloads
      - ./soularr/config:/data
    depends_on:
      - lidarr
      - slskd

  # Immich manages its own storage: originals, thumbnails and transcodes all
  # live under ${STORAGE_ROOT}/immich. Photos get in via the mobile app or the
  # CLI — dropping files into this folder by hand does nothing, Immich does not
  # scan it. It has no PUID/PGID support and runs as root.
  immich-server:
    <<: *common
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich-server
    volumes:
      - ${STORAGE_ROOT}/immich:/data
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
    depends_on:
      - immich-postgres
      - immich-redis

  # Postgres data must live on local disk — network shares are unsupported.
  immich-postgres:
    <<: *common
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if ./immich/postgres is not on an SSD.
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ./immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb

  immich-redis:
    <<: *common
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich-redis
    healthcheck:
      test: redis-cli ping || exit 1

  # CPU inference, always on. Not an optimisation — smart search encodes the
  # *query text* through the CLIP text tower at search time, so without a
  # reachable ML server there is no searching at all.
  #
  # The GPU box in immich/remote-ml.yml is the fast path for bulk indexing and
  # is listed ahead of this one; Immich health-checks both and skips whichever
  # is down, so this is the fallback that keeps search alive the rest of the week.
  # No published port: immich-server reaches it over app-network by name.
  immich-machine-learning:
    <<: *common
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: immich-machine-learning
    volumes:
      - immich-model-cache:/cache

networks:
  app-network:
    driver: bridge

volumes:
  adguard-work-data:
    driver: local
  immich-model-cache:
    driver: local